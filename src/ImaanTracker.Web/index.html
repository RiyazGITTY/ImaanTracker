<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Imaan Tracker</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="brand">
      <p class="eyebrow">Imaan Tracker</p>
      <h1>Track today's five prayers.</h1>
      <p class="subtle">Indeed, prayer prohibits immorality and wrongdoing, and the remembrance of Allah is greater. Quran 29:45</p>
    </section>

    <section id="authPanel" class="panel">
      <div class="tabs" role="tablist">
        <button id="loginTab" class="tab active" type="button">Login</button>
        <button id="signupTab" class="tab" type="button">Sign up</button>
      </div>

      <form id="loginForm" class="form">
        <label>Email<input id="loginEmail" type="email" autocomplete="email" required></label>
        <label>Password
          <span class="password-field">
            <input id="loginPassword" type="password" autocomplete="current-password" required>
            <button class="eye-button" type="button" aria-label="Show password" data-toggle-password="#loginPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>loginButton
          <button id="loginButton" class="primary" type="submit">
          <span class="button-text">Login</span>
          <span class="loader" aria-hidden="true"></span>
        </button>
      </form>

      <form id="signupForm" class="form hidden">
        <label>Full name<input id="signupName" autocomplete="name" required></label>
        <label>Email<input id="signupEmail" type="email" autocomplete="email" required></label>
        <label>Mobile number<input id="signupMobile" type="tel" autocomplete="tel" required></label>
        <label>Password
          <span class="password-field">
            <input id="signupPassword" type="password" autocomplete="new-password" required minlength="6">
            <button class="eye-button" type="button" aria-label="Show password" data-toggle-password="#signupPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>
        <label>Confirm password
          <span class="password-field">
            <input id="signupConfirmPassword" type="password" autocomplete="new-password" required minlength="6">
            <button class="eye-button" type="button" aria-label="Show confirm password" data-toggle-password="#signupConfirmPassword">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </span>
        </label>
        <div class="split">
          <label>City<input id="signupCity" required></label>
          <label>Country<input id="signupCountry" required></label>
        </div>
        <button id="signupButton" class="primary" type="submit">
          <span class="button-text">Create account</span>
          <span class="loader" aria-hidden="true"></span>
        </button>
      </form>

      <p id="authMessage" class="message"></p>
    </section>

    <section id="prayerPanel" class="panel hidden">
      <div class="topbar">
        <div>
          <button id="dateCard" class="date-card" type="button" aria-label="Show Arabic calendar date">
            <strong id="dateCardValue"></strong>
          </button>
          <p id="salaamText" class="salaam">Assalamu Alaikum,</p>
          <h2>Prayer checklist</h2>
        </div>
        <div class="top-actions">
          <button id="adminButton" class="ghost admin-button hidden" type="button">Admin</button>
          <button id="logoutButton" class="ghost logout-icon" type="button" aria-label="Logout" title="Logout">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l5-5-5-5"/>
              <path d="M15 12H3"/>
              <path d="M21 19V5"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="progress">
        <div>
          <strong id="statusText">0 of 5 complete</strong>
          <span id="completeText">Keep going.</span>
        </div>
        <div id="progressCircle">0%</div>
      </div>

      <div class="history-tools">
        <div class="period-tabs" role="tablist" aria-label="Prayer summary period">
          <button class="period-tab active" type="button" data-period="day">Day</button>
          <button class="period-tab" type="button" data-period="week">Week</button>
          <button class="period-tab" type="button" data-period="month">Month</button>
        </div>
        <div id="prayerStats" class="prayer-stats"></div>
      </div>

      <div class="calendar-panel">
        <div class="calendar-head">
          <button id="previousMonthButton" class="ghost calendar-nav" type="button" aria-label="Previous month">&lt;</button>
          <strong id="calendarTitle"></strong>
          <button id="nextMonthButton" class="ghost calendar-nav" type="button" aria-label="Next month">&gt;</button>
        </div>
        <div class="calendar-weekdays" aria-hidden="true">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>

      <div id="prayerList" class="prayer-list"></div>
      <p id="prayerMessage" class="message"></p>
    </section>

    <section id="adminPanel" class="panel admin-panel hidden">
      <div class="topbar">
        <div>
          <p class="salaam">Admin dashboard</p>
          <h2>Manage users</h2>
        </div>
        <div class="top-actions">
          <button id="backToPrayersButton" class="ghost admin-button" type="button">Prayers</button>
          <button id="adminLogoutButton" class="ghost logout-icon" type="button" aria-label="Logout" title="Logout">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17l5-5-5-5"/>
              <path d="M15 12H3"/>
              <path d="M21 19V5"/>
            </svg>
          </button>
        </div>
      </div>

      <div id="adminSummary" class="admin-summary"></div>
      <div id="adminUsers" class="admin-users"></div>
      <p id="adminMessage" class="message"></p>
    </section>
  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
